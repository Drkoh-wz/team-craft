# Flowise-like multi-agent team plugin bundle patch layer.
# Applied after the base/web-app bundles, before the profile's own cordis.patch.yml.

# The team plugin is HOST-plane: it publishes a service (teamOrchestrator),
# registers into the host tools registry, and owns durable storage domains.
# It must sit as a host composition row, NOT behind a preset isolate realm
# (its service is consumed beyond one session).
#
# Storage routing: @deepseek-ai/dsh-storage-domain is ALREADY composed by the
# web-app bundle with `backend: json` (root dshHomePath('storages')). Our team
# domains (team_agent_defs / team_ledger / team_workflows / team_runs) therefore
# auto-route to the file backend — no duplicate storage-domain row is added here
# (a second one would collide with the already-mounted service).

# The `flowise-team` row is declared HERE, by the bundle that owns it, so that
# installing this package is enough to mount it. `dsh plugin --profile <name> add`
# only adds the package to `dsh.profile.bundles` and composes this layer; it never
# writes into the profile's own patch file, so a row declared there instead would
# leave the bundle mounted and contributing nothing.
#
# This was verified, not assumed. Two throwaway profiles were composed with
# `dsh --profile <p> --dump-config`, differing only in this file: with `[]` the
# composed tree contained no `flowise-team` row; with the `- insert:` below it did.
# The reference community plugin `dshmarket` ships its row the same way.
- insert:
    - id: flowise-team
      name: '@local/team-flowise'
      disabled: false
